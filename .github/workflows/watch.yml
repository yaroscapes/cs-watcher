name: watch cs

on:
  # Primary trigger: external cron service POSTs a workflow_dispatch
  # every ~5 min via GitHub's API. Reliable, fires within seconds.
  # Requires only an Actions:Write fine-grained PAT (no Contents
  # access — token can't push commits).
  workflow_dispatch:

  # Backup trigger: GitHub's own scheduler (best-effort, often 15-60
  # min in practice). Only useful if the external cron stops firing.
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read

concurrency:
  group: watcher
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python deps
        run: pip install -r requirements.txt

      # Cache the Chromium browser binary across runs (~150 MB).
      # Without this, every run downloads it fresh.
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Chromium for Playwright
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: python -m playwright install chromium --with-deps

      - name: Install Chromium system deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: python -m playwright install-deps chromium

      - name: Restore state cache
        uses: actions/cache@v4
        with:
          path: .state.json
          key: watcher-state-${{ github.run_id }}
          restore-keys: |
            watcher-state-

      - name: Run watcher
        env:
          TARGETS_JSON: ${{ secrets.TARGETS_JSON }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          # Everything NOT flagged `fast` — the flagged ones belong to
          # watch-fast.yml, which runs browser-free on a tighter cron.
          TIER: main
        run: python watcher.py
