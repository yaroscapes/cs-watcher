name: Watch campsites

on:
  # Cron: every 5 minutes. GitHub schedules best-effort under load,
  # so expect 5-15 min in practice. 5 is the documented minimum.
  schedule:
    - cron: "*/5 * * * *"
  # Allow manual runs from the Actions tab (good for first-time testing).
  workflow_dispatch:

# Defense in depth: workflow has read-only permissions, so even if
# something goes wrong, it can't push to the repo or open issues etc.
permissions:
  contents: read

# Only one run at a time. If a slow run is in progress, skip the next
# scheduled tick rather than pile up.
concurrency:
  group: watcher
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false  # don't keep the GITHUB_TOKEN around

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Restore the previous run's state so we don't re-notify for the
      # same availability over and over. Cache key uses run_id so we
      # always save a fresh entry; restore-keys lets us pick up the
      # most recent prior cache on a fuzzy match.
      - name: Restore state cache
        uses: actions/cache@v4
        with:
          path: .state.json
          key: watcher-state-${{ github.run_id }}
          restore-keys: |
            watcher-state-

      - name: Run watcher
        env:
          # Both come from GitHub Secrets. Never echo these.
          TARGETS_JSON: ${{ secrets.TARGETS_JSON }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python watcher.py
